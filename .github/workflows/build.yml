name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# This workflow only builds and uploads an artifact; it makes no repository
# writes. release.yml needs contents: write for `gh release create` — do not
# copy this block there.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # primary.rc references primary.manifest as an opaque file, so windres
      # never preprocesses it and its assemblyIdentity version cannot come from
      # app_strings.h — it has to be bumped by hand. This makes the two drifting
      # apart fail the build instead of relying on a release-checklist step.
      #
      # Expects name= and version= on one line of the assemblyIdentity element;
      # reformatting that element fails this check rather than skipping it.
      - name: Verify the manifest version matches app_strings.h
        run: |
          maj=$(grep -oP 'APP_VERSION_MAJOR\s+\K\d+' resources/app_strings.h)
          min=$(grep -oP 'APP_VERSION_MINOR\s+\K\d+' resources/app_strings.h)
          pat=$(grep -oP 'APP_VERSION_PATCH\s+\K\d+' resources/app_strings.h)
          # VERSIONINFO is MAJOR,MINOR,PATCH,0; the manifest mirrors that.
          want="$maj.$min.$pat.0"
          got=$(grep -oP '<assemblyIdentity[^>]*\bname="Primary"[^>]*\bversion="\K[^"]+' \
                resources/primary.manifest)
          echo "app_strings.h: $want / manifest: ${got:-none}"
          if [ "$got" != "$want" ]; then
            echo "::error::resources/primary.manifest version ${got:-(not found)} does not match $want from resources/app_strings.h. Update the assemblyIdentity version."
            exit 1
          fi

      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Build
        shell: bash
        run: ./build.sh 2>&1 | tee build.log

      - name: Fail on compiler warnings
        run: |
          if grep -i "warning:" build.log; then
            echo "::error::Build produced compiler warnings"
            exit 1
          fi
          echo "No warnings."

      # Guards against the README drifting from the real build invocation.
      # This command is a verbatim copy of the one in README.md; if you change
      # one, change both. Omitting -municode fails with 'undefined reference
      # to WinMain', which shipped undetected before this check existed.
      - name: Verify the README's documented build command works
        run: |
          x86_64-w64-mingw32-windres resources/primary.rc -O coff -o /tmp/primary.res
          x86_64-w64-mingw32-g++ -std=c++11 -Wall -Wextra -Wno-unused-parameter \
               -Os -DUNICODE -D_UNICODE \
               -mwindows -municode \
               src/primary.cpp \
               /tmp/primary.res \
               -o /tmp/Primary.exe \
               -luser32 -lshell32 -lcomctl32 -static-libgcc -static-libstdc++ \
               -Wl,-s
          test -f /tmp/Primary.exe

      - name: Verify the version resource is embedded
        run: |
          status=0
          for field in "Jonathan Bnayahu" "Primary.exe"; do
            if ! strings -el Primary.exe | grep -qF "$field"; then
              echo "::error::Version resource missing: $field"
              status=1
            fi
          done
          exit $status

      - name: Verify the manifest is embedded
        run: |
          status=0
          for field in dpiAwareness Common-Controls asInvoker; do
            if ! strings -a Primary.exe | grep -q "$field"; then
              echo "::error::Manifest missing: $field"
              status=1
            fi
          done
          exit $status

      # Extracted per macro rather than with one alternation piped through
      # `paste`, which silently assumed MAJOR/MINOR/PATCH appear in that order
      # in the header. An empty component would build a nonsense version like
      # "1..0", so each is asserted non-empty.
      - name: Verify the version resource matches app_strings.h
        run: |
          maj=$(grep -oP 'APP_VERSION_MAJOR\s+\K\d+' resources/app_strings.h)
          min=$(grep -oP 'APP_VERSION_MINOR\s+\K\d+' resources/app_strings.h)
          pat=$(grep -oP 'APP_VERSION_PATCH\s+\K\d+' resources/app_strings.h)
          for c in "$maj" "$min" "$pat"; do
            [ -n "$c" ] || { echo "::error::Could not read APP_VERSION_* from resources/app_strings.h"; exit 1; }
          done
          src="$maj.$min.$pat"
          echo "Source version: $src"
          strings -el Primary.exe | grep -qF "$src" || {
            echo "::error::Binary does not report source version $src"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: Primary-exe
          path: Primary.exe
          if-no-files-found: error
