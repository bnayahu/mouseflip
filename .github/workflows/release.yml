name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      # A binary that misreports its own version is worse than a failed
      # release, so this gate is hard.
      - name: Verify the tag matches the source version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          # Extracted per macro rather than with one alternation piped through
          # `paste`, which silently assumed MAJOR/MINOR/PATCH appear in that
          # order in the header. An empty component would build a nonsense
          # version like "1..0", so each is asserted non-empty.
          maj=$(grep -oP 'APP_VERSION_MAJOR\s+\K\d+' resources/app_strings.h)
          min=$(grep -oP 'APP_VERSION_MINOR\s+\K\d+' resources/app_strings.h)
          pat=$(grep -oP 'APP_VERSION_PATCH\s+\K\d+' resources/app_strings.h)
          for c in "$maj" "$min" "$pat"; do
            [ -n "$c" ] || { echo "::error::Could not read APP_VERSION_* from resources/app_strings.h"; exit 1; }
          done
          src="$maj.$min.$pat"
          echo "Tag: $tag / source: $src"
          if [ "$tag" != "$src" ]; then
            echo "::error::Tag $tag does not match source version $src. Bump APP_VERSION_* in resources/app_strings.h."
            exit 1
          fi

      # primary.manifest is referenced by primary.rc as an opaque file, so
      # windres never preprocesses it and its assemblyIdentity version has to be
      # bumped by hand. Refuse to ship a release where it disagrees with the
      # source version. (Kept as a separate step from the tag gate above so the
      # failure says which of the two is wrong.)
      - name: Verify the manifest version matches the source version
        run: |
          maj=$(grep -oP 'APP_VERSION_MAJOR\s+\K\d+' resources/app_strings.h)
          min=$(grep -oP 'APP_VERSION_MINOR\s+\K\d+' resources/app_strings.h)
          pat=$(grep -oP 'APP_VERSION_PATCH\s+\K\d+' resources/app_strings.h)
          want="$maj.$min.$pat.0"
          got=$(grep -oP '<assemblyIdentity[^>]*\bname="Primary"[^>]*\bversion="\K[^"]+' \
                resources/primary.manifest)
          echo "app_strings.h: $want / manifest: ${got:-none}"
          if [ "$got" != "$want" ]; then
            echo "::error::resources/primary.manifest version ${got:-(not found)} does not match $want from resources/app_strings.h. Update the assemblyIdentity version."
            exit 1
          fi

      - name: Build
        shell: bash
        run: ./build.sh 2>&1 | tee build.log

      - name: Fail on compiler warnings
        run: |
          if grep -i "warning:" build.log; then
            echo "::error::Build produced compiler warnings"
            exit 1
          fi

      - name: Verify the binary reports the release version
        run: |
          strings -el Primary.exe | grep -qF "${GITHUB_REF_NAME#v}" || {
            echo "::error::Binary does not report ${GITHUB_REF_NAME#v}"; exit 1; }

      - name: Generate checksums
        run: sha256sum Primary.exe > SHA256SUMS.txt

      - name: Assemble release notes
        run: |
          # First "## [" section of the CHANGELOG, plus the standing footer
          awk '/^## \[/{n++} n==1' CHANGELOG.md > notes.md
          cat .github/release-footer.md >> notes.md
          echo "--- notes.md ---"
          cat notes.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            Primary.exe SHA256SUMS.txt \
            --title "Primary $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag
